# Dark Souls III profile: one creator, one game, one run.
#
# This file declares domain vocabulary — names for things the game contains and
# motifs this creator uses. It is NOT an observation about any video: the
# deterministic pass emits no entity, motif or HUD claim, so nothing here is
# asserted as having appeared. It becomes meaningful only when a reader that
# consumes it exists (the model-backed extraction pass), at which point those
# claims will cite these declared ids.
#
# v0.1.0 deliberately changes NO threshold: it changes identity and vocabulary,
# not measurement. A threshold change requires a version bump.

schema_version = "1.0.0"

[profile]
id = "ds3"
version = "0.1.0"
creator_id = "creator_01"
game_id = "dark_souls_3"
game_label = "Dark Souls III"

[vocabulary]
terms = [
  "ext:you_died",
  "ext:bonfire_lit",
  "ext:estus_drink",
  "ext:hud_death_counter",
]

